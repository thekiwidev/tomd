[project]
name = "tomd"
version = "0.2.0"
description = "Drag & drop GUI for Microsoft MarkItDown — convert anything to Markdown"
readme = "README.md"
requires-python = ">=3.12"
# The sidecar (sidecar.py, backend.py, links.py) uses the standard library only.
dependencies = []

[dependency-groups]
dev = [
    # markitdown is NOT bundled into the app; it's here so a development build
    # finds a markitdown CLI on PATH.
    "markitdown[all]>=0.1.5",
    "pyinstaller>=6.20.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
