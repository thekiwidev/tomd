name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# macOS only: the Windows build of the Tauri app is not done yet, and Windows
# users stay on v0.1.11 (docs/index.html links to that release directly).
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build .app and .dmg
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v5
        with:
          name: tomd-macos
          path: dist/tomd.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/tomd.dmg
          generate_release_notes: true
