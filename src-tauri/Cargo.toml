[package]
name = "tomd"
version = "0.2.0"
description = "Drag & drop GUI for Microsoft MarkItDown"
authors = ["thekiwidev"]
edition = "2021"

[lib]
name = "tomd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-drag = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSUserDefaults"] }

# Debug info triples the size of target/ and nobody attaches a debugger.
[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
